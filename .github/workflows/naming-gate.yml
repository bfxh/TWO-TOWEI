# 命名纪律门（用户命名宪法：除主名外，一切命名必须专业）。
# 本仓主名 = **TWO-TOWEI**；新仓无退役旧名，--forbid 暂空。
# 判据与豁免模型见 scripts/naming_gate.py 头注；与 BSHSQ / ADV 同一门脚本，各自仓内自包含。
name: naming-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  naming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: 命名纪律门（占位词/杂物）
        run: python -X utf8 scripts/naming_gate.py
